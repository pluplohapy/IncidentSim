apiVersion: incidentsim/v1
kind: Incident
metadata:
  id: log-flood-disk
  title: "Диск заполнен логами"
  level: config
  tags: [logs, disk]
  estimated_minutes: 25
spec:
  runtime:
    engine: compose
  services:
    - name: app
      image: incidentsim/workload:dev
      env:
        LOG_FILE: /var/log/app/app.log
      ports: [8080]
      healthcheck:
        path: /healthz
        port: 8080
  symptoms:
    - id: disk-full
      observation: "Метрика app_disk_used_pct приблизилась к 100, запись новых логов падает"
  hints:
    - level: 1
      text: "Посмотрите на размер файла лога и на уровень логирования"
  fault:
    type: feature_flag
    target: app
    options:
      env:
        LOG_LEVEL: debug
  verify:
    correctness:
      - id: healthz-200
        type: http
        service: app
        path: /healthz
        expect:
          status: 200
    quality:
      - id: log-level-info
        type: policy
        service: app
        rule: env_flag_equals
        query: LOG_LEVEL
        expect:
          equals: info
        reason: "debug-логи в проде запрещены политикой, уровень должен быть info"
  root_cause:
    summary: "Включён debug-уровень логирования, файл лога растёт без ротации."
    layer: config
    signals:
      - "app_disk_used_pct > 95"
    masked_by: [delete-log-file]
  reference_solution:
    summary: "Понизить LOG_LEVEL до info, включить ротацию, перезапустить сервис."
    steps:
      - "Проверить уровень логирования"
      - "Выставить LOG_LEVEL=info"
    commands:
      - "incidentsim apply --service app --set LOG_LEVEL=info"
  distractors:
    - id: delete-log-file
      title: "Удалить файл лога, чтобы освободить диск"
      symptom: disk-full
      masked_artifact: "история логов, нужная для разбора"
      fails: log-level-info
  replay:
    profile: workloads/log-flood-disk.yaml
    duration: 30s
    rps: 10
