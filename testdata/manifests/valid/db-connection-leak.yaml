apiVersion: incidentsim/v1
kind: Incident
metadata:
  id: db-connection-leak
  title: "Пул соединений к БД исчерпан"
  level: code
  tags: [postgres, go, connection-pool]
  estimated_minutes: 30
spec:
  runtime:
    engine: compose
    memory_mib: 1024
  services:
    - name: db
      image: postgres:16-alpine
      env:
        POSTGRES_PASSWORD: incidentsim
        POSTGRES_DB: orders
      ports: [5432]
    - name: app
      image: incidentsim/workload:dev
      env:
        DB_HOST: db
        DB_PORT: "5432"
        DB_NAME: orders
        DB_USER: postgres
        DB_PASSWORD: incidentsim
      ports: [8080]
      healthcheck:
        path: /healthz
        port: 8080
        interval_seconds: 5
        timeout_seconds: 2
  editable: [app/main.go, go.mod, go.sum]
  symptoms:
    - id: errors-5xx
      observation: "GET /api/orders отвечает 503, в логах app видны connection pool exhausted"
  hints:
    - level: 1
      text: "Сравните метрики app_db_pool_in_use и app_db_pool_max"
  verify:
    correctness:
      - id: healthz-200
        type: http
        service: app
        path: /healthz
        expect:
          status: 200
      - id: errors-bounded
        type: metric
        service: app
        query: app_errors_total
        duration: 30s
        expect:
          max: 5
    quality:
      - id: pool-in-use-not-maxed
        type: metric
        service: app
        query: app_db_pool_in_use
        duration: 30s
        expect:
          max: 15
        reason: "Утечка соединений должна быть исправлена в коде, а не скрыта ростом лимита пула"
      - id: max-connections-not-inflated
        type: sql
        service: db
        sql: "SHOW max_connections"
        expect:
          max: 200
        reason: "Раздувание лимита соединений БД убирает симптом, оставляя утечку"
  root_cause:
    summary: "Приложение не возвращает соединения в пул: в обработчике заказов отсутствует defer rows.Close(), соединения остаются открытыми."
    layer: code
    signals:
      - "app_db_pool_in_use == app_db_pool_max"
      - "pg_stat_activity: много idle in transaction"
    masked_by: [raise-max-connections]
  theory: |
    Утечка соединений — типовой дефект уровня кода: пул берёт соединение и не
    возвращает его в общем случае ошибки. Первое, что видит участник, —
    исчерпание пула и 503 на запросах. Диагностика идёт по метрикам
    app_db_pool_in_use относительно app_db_pool_max и по pg_stat_activity.
    "Раздуть max_connections" убирает симптом и оставляет утечку: через
    несколько часов она съест и новый лимит.
  reference_solution:
    summary: "Добавить defer rows.Close() в обработчик заказов"
    steps:
      - "Открыть ~/.incidentsim/sessions/<id>/workspace/app/main.go"
      - "Добавить defer rows.Close() сразу после получения rows в обработчике заказов"
      - "incidentsim apply <session> --service app --file app/main.go --content <новое содержимое>"
      - "Повторить verify"
    rollback: "incidentsim reset <session>"
  distractors:
    - id: raise-max-connections
      title: "Раздуть max_connections в БД, чтобы ошибки исчезли"
      symptom: errors-5xx
      masked_artifact: "потребление соединений на стороне БД"
      fails: max-connections-not-inflated
  replay:
    profile: workloads/db-connection-leak.yaml
    duration: 30s
    rps: 20
