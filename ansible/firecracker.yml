---
# Provisioning a bare-metal Linux host for the Firecracker engine.
#
# The playbook installs Firecracker, creates the tap/bridge network the microVMs
# use, installs the systemd units that own VM lifecycles and builds the rootfs
# layers from the task images.
#
# Run order matters: install → network → systemd → rootfs.
- name: Provision the IncidentSim Firecracker host
  hosts: incidentsim
  become: true
  vars_files:
    - roles/firecracker/defaults/main.yml

  roles:
    - role: firecracker
      tags: [firecracker]

  tasks:
    - name: Install kernel and virtualization tooling
      ansible.builtin.apt:
        name:
          - linux-generic
          - linux-generic-hwe-24.04
          - kvm
          - qemu-utils
          - squashfs-tools
          - nftables
          - socat
          - python3
        state: present
        update_cache: true
      tags: [packages]

    - name: Load the KVM module
      community.general.modprobe:
        name: kvm
        state: present
      tags: [kvm]

    - name: Load the architecture specific KVM module
      community.general.modprobe:
        name: "{{ 'kvm_intel' if ansible_processor_vendor == 'GenuineIntel' else 'kvm_amd' }}"
        state: present
      when: ansible_processor_vendor in ['GenuineIntel', 'AuthenticAMD']
      tags: [kvm]

    - name: Verify KVM is usable
      ansible.builtin.command:
        cmd: test -c /dev/kvm
      changed_when: false
      tags: [kvm]

    - name: Download pinned Firecracker release
      ansible.builtin.get_url:
        url: "{{ incidentsim_firecracker_url }}"
        dest: "/tmp/firecracker-{{ incidentsim_firecracker_version }}.tgz"
        mode: "0644"
        checksum: "{{ incidentsim_firecracker_checksum }}"
      tags: [firecracker]

    - name: Extract pinned Firecracker release
      ansible.builtin.unarchive:
        src: "/tmp/firecracker-{{ incidentsim_firecracker_version }}.tgz"
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=1]
        include:
          - "release-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }}/firecracker-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }}"
          - "release-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }}/jailer-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }}"
      tags: [firecracker]

    - name: Rename extracted Firecracker binaries
      ansible.builtin.shell: |
        set -eu
        install -m 0755 /usr/local/bin/release-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }}/firecracker-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }} /usr/local/bin/firecracker
        install -m 0755 /usr/local/bin/release-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }}/jailer-v{{ incidentsim_firecracker_version }}-{{ incidentsim_firecracker_arch }} /usr/local/bin/jailer
      args:
        creates: /usr/local/bin/firecracker
      tags: [firecracker]

    - name: Create the state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ incidentsim_state_dir }}"
        - "{{ incidentsim_rootfs_dir }}"
        - "{{ incidentsim_vm_dir }}"
      tags: [firecracker]

    - name: Export the workload rootfs layer
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          image="incidentsim/workload:dev"
          name="$(echo "$image" | sed 's#/#_#g; s#:#-#g; s#@#_#g')"
          target="{{ incidentsim_rootfs_dir }}/${name}.squashfs"
          if [ -f "$target" ]; then
            exit 0
          fi
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker export "$container" -o "/tmp/${name}.tar"
          mksquashfs "/tmp/${name}.tar" "$target" -noappend
          rm -f "/tmp/${name}.tar"
        executable: /bin/bash
      args:
        creates: "{{ incidentsim_rootfs_dir }}/incidentsim_workload-dev.squashfs"
      tags: [rootfs]

    - name: Download the guest kernel
      ansible.builtin.get_url:
        url: "{{ incidentsim_kernel_url }}"
        dest: "/var/lib/incidentsim/vmlinux"
        mode: "0644"
        checksum: "{{ incidentsim_kernel_checksum }}"
      tags: [firecracker]

    - name: Authorise the simulator user to run firecracker
      ansible.builtin.user:
        name: "{{ incidentsim_user }}"
        groups: [kvm]
        append: true
      tags: [firecracker]

    - name: Install the per-VM lifecycle unit template
      ansible.builtin.template:
        src: templates/incidentsim-vm@.service.j2
        dest: /etc/systemd/system/incidentsim-vm@.service
        mode: "0644"
      notify: Reload systemd
      tags: [systemd]

    - name: Install the IncidentSim core unit
      ansible.builtin.template:
        src: templates/incidentsim-core.service.j2
        dest: /etc/systemd/system/incidentsim-core.service
        mode: "0644"
      notify: Reload systemd
      tags: [systemd]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
