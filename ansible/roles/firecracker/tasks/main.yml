---
# Tasks of the Firecracker role. The role owns everything that is specific to
# one host: the bridge, the tap devices, and the systemd units that keep a
# microVM alive. The image content is owned by the content branch, not here.

- name: Install the bridge and NAT for microVM traffic
  ansible.builtin.template:
    src: templates/incidentsim-network.sh.j2
    dest: /usr/local/sbin/incidentsim-network
    mode: "0755"
  tags: [network]

- name: Install the network setup unit
  ansible.builtin.template:
    src: templates/incidentsim-network.service.j2
    dest: /etc/systemd/system/incidentsim-network.service
    mode: "0644"
  notify: Reload systemd
  tags: [network]

- name: Create the tap devices used by the microVMs
  ansible.builtin.command:
    cmd: ip tuntap add dev incidentsim-tap{{ item }} mode tap
  loop: "{{ range(0, incidentsim_tap_count | int) | list }}"
  args:
    creates: "/sys/class/net/incidentsim-tap{{ item }}"
  tags: [network]

- name: Attach the tap devices to the bridge
  ansible.builtin.command:
    cmd: ip link set incidentsim-tap{{ item }} master {{ incidentsim_bridge }}
  loop: "{{ range(0, incidentsim_tap_count | int) | list }}"
  changed_when: false
  tags: [network]

- name: Bring the tap devices up
  ansible.builtin.command:
    cmd: ip link set incidentsim-tap{{ item }} up
  loop: "{{ range(0, incidentsim_tap_count | int) | list }}"
  changed_when: false
  tags: [network]

- name: Enable the network unit
  ansible.builtin.systemd:
    name: incidentsim-network.service
    enabled: true
    state: started
  tags: [network]

- name: Allow forwarded traffic on the microVM subnet
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
  tags: [network]
