all:
  children:
    incidentsim:
      hosts:
        # A bare-metal host with KVM. A normal VM will not work: Firecracker
        # needs a real hypervisor, which a nested VM on Apple Silicon does not
        # provide.
        bare-metal.example.com:
          ansible_user: root
      vars:
        ansible_python_interpreter: /usr/bin/python3
