# Конфигурация ядра IncidentSim.
#
# Значения по умолчанию описаны в internal/core/config.go: на чистом
# чекауте этого файла может не быть вовсе.

listen: 127.0.0.1:8747
catalog: manifests
state: .incidentsim
engine: compose

# Firecracker-движок (bare-metal Linux с KVM) настраивается ansible:
# ansible/firecracker.yml создаёт артефакты, которые указывает эта секция.
# На macOS Firecracker недоступен: нет KVM, эмуляция не поддерживается.
#firecracker:
#  firecracker_bin: /usr/local/bin/firecracker
#  socket_dir: /var/lib/incidentsim/vms
#  kernel_image: /var/lib/incidentsim/vmlinux
#  rootfs_image: /var/lib/incidentsim/rootfs.squashfs
#  baseline_snapshot: /var/lib/incidentsim/snapshots/baseline.snap
#  guest_agent_port: 51000

# Аудит сессий через Teleport. Не блокирует MVP.
#teleport:
